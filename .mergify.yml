queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - check-success = Code Quality
      - check-success = Test (Windows)
    merge_conditions:
      - check-success = Code Quality
      - check-success = Test (Windows)

merge_protections:
  - name: CI must pass
    if:
      - base = main
    success_conditions:
      - "#commits-behind <= 3"
      - check-success = Code Quality
      - check-success = Test (Windows)

pull_request_rules:
  - name: Auto-approve Dependabot PRs when CI passes
    conditions:
      - author = dependabot[bot]
      - check-success = Code Quality
      - check-success = Test (Windows)
    actions:
      review:
        type: APPROVE

  - name: Auto-approve Dosubot PRs when CI passes
    conditions:
      - author = dosubot[bot]
      - check-success = Code Quality
      - check-success = Test (Windows)
    actions:
      review:
        type: APPROVE

  - name: Keep bot PRs up to date
    conditions:
      - or:
          - author = dependabot[bot]
          - author = dosubot[bot]
          - author = release-plz[bot]
    actions:
      update: {}

merge_protections_settings:
  reporting_method: check-runs
  # Auto-enqueue bot PRs once CI passes. This is the mechanism that actually
  # auto-merges (the pull_request_rules `queue` action only renders a manual
  # checkbox in this Mergify version). Each PR still has to satisfy the
  # `default` queue rule's merge_conditions (Code Quality + Test (Windows))
  # before it merges.
  auto_merge_conditions:
    - or:
        - and:
            - base = main
            - label != do-not-merge
            - author = dependabot[bot]
        - and:
            - base = main
            - label != do-not-merge
            - author = dosubot[bot]
        - and:
            - base = main
            - label = release
            - author = release-plz[bot]
