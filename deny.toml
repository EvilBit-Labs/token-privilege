# cargo-deny configuration for token-privilege
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
all-features = true
exclude-dev = true

[licenses]
unused-allowed-license = "allow"
# Allow common open source licenses used in the Rust ecosystem
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
include-dev = true

# Confidence threshold for license detection
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = 'deny'
deny = [
    { crate = "git2", use-instead = "gix" },
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    "libssh2-sys",
    { crate = "cmake", use-instead = "cc" },
]
skip = [
    { crate = "windows-sys", reason = "fs4 and rustix pull different versions" },
]
skip-tree = [  ]

[advisories]
yanked       = "deny"
unmaintained = "workspace"
ignore       = [  ]

[sources]
# Allow crates from crates.io
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = [ "https://github.com/rust-lang/crates.io-index" ]

[sources.allow-org]
# Allow specific organizations for git sources if needed
github    = [  ]
gitlab    = [  ]
bitbucket = [  ]
